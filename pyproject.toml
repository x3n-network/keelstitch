[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "keelstitch"
version = "0.1.0"
description = "Operator-approved SSH actions for agents and terminals"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["asyncssh>=2.22,<3", "mcp>=1.26,<2", "typing-extensions>=4.12,<5"]

[project.urls]
Homepage = "https://x3n.network"

[project.scripts]
keelstitch = "keelstitch.cli:main"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "assets/keelstitch.svg", "README.md", "SECURITY.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/keelstitch"]
